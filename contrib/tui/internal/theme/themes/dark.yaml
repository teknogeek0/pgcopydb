palette:
  bg_primary:    "#1a1b26"
  bg_secondary:  "#24283b"
  bg_highlight:  "#414868"
  fg_primary:    "#c0caf5"
  fg_secondary:  "#a9b1d6"
  fg_dim:        "#565f89"
  accent:        "#7aa2f7"
  success:       "#9ece6a"
  warning:       "#e0af68"
  error:         "#f7768e"
  info:          "#2ac3de"
  magenta:       "#bb9af7"
  orange:        "#ff9e64"

components:
  header:
    background: "bg_secondary"
    foreground: "fg_primary"
    dim_foreground: "fg_secondary"
    title_bold: true
  tab_bar:
    background: "bg_secondary"
    active_fg: "bg_primary"
    active_bg: "accent"
    inactive_fg: "fg_secondary"
    inactive_bg: "bg_secondary"
  content:
    foreground: "fg_primary"
    background: "bg_primary"
  status_bar:
    foreground: "fg_dim"
    background: "bg_secondary"
    error_fg: "error"
    connected_fg: "success"
  table:
    header_fg: "fg_primary"
    header_bg: "bg_secondary"
    header_bold: true
    row_fg: "fg_primary"
    row_alt_bg: "bg_secondary"
    selected_fg: "bg_primary"
    selected_bg: "accent"
  gauge:
    empty_fg: "fg_dim"
    label_fg: "fg_secondary"
    thresholds:
      - { percent: 0,  color: "success" }
      - { percent: 70, color: "warning" }
      - { percent: 90, color: "error" }
  checklist:
    done_fg: "success"
    active_fg: "accent"
    pending_fg: "fg_dim"
  section_title:
    foreground: "accent"
    bold: true
  colors:
    green: "success"
    yellow: "warning"
    red: "error"
    cyan: "info"
    blue: "accent"
    magenta: "magenta"
    dim: "fg_dim"
    bright: "fg_primary"
