palette:
  bg_primary:    "#ffffff"
  bg_secondary:  "#e8e8e8"
  bg_highlight:  "#d0d0d0"
  fg_primary:    "#1a1a2e"
  fg_secondary:  "#4a4a5e"
  fg_dim:        "#8a8a9e"
  accent:        "#2563eb"
  success:       "#16a34a"
  warning:       "#ca8a04"
  error:         "#dc2626"
  info:          "#0891b2"
  magenta:       "#9333ea"
  orange:        "#ea580c"

components:
  header:
    background: "bg_secondary"
    foreground: "fg_primary"
    dim_foreground: "fg_secondary"
    title_bold: true
  tab_bar:
    background: "bg_secondary"
    active_fg: "bg_primary"
    active_bg: "accent"
    inactive_fg: "fg_secondary"
    inactive_bg: "bg_secondary"
  content:
    foreground: "fg_primary"
    background: "bg_primary"
  status_bar:
    foreground: "fg_dim"
    background: "bg_secondary"
    error_fg: "error"
    connected_fg: "success"
  table:
    header_fg: "fg_primary"
    header_bg: "bg_secondary"
    header_bold: true
    row_fg: "fg_primary"
    row_alt_bg: "bg_secondary"
    selected_fg: "bg_primary"
    selected_bg: "accent"
  gauge:
    empty_fg: "fg_dim"
    label_fg: "fg_secondary"
    thresholds:
      - { percent: 0,  color: "success" }
      - { percent: 70, color: "warning" }
      - { percent: 90, color: "error" }
  checklist:
    done_fg: "success"
    active_fg: "accent"
    pending_fg: "fg_dim"
  section_title:
    foreground: "accent"
    bold: true
  colors:
    green: "success"
    yellow: "warning"
    red: "error"
    cyan: "info"
    blue: "accent"
    magenta: "magenta"
    dim: "fg_dim"
    bright: "fg_primary"
