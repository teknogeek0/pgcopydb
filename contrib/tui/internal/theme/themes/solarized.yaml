palette:
  bg_primary:    "#002b36"
  bg_secondary:  "#073642"
  bg_highlight:  "#586e75"
  fg_primary:    "#839496"
  fg_secondary:  "#93a1a1"
  fg_dim:        "#586e75"
  accent:        "#2aa198"
  success:       "#859900"
  warning:       "#b58900"
  error:         "#dc322f"
  info:          "#268bd2"
  magenta:       "#d33682"
  orange:        "#cb4b16"

components:
  header:
    background: "bg_secondary"
    foreground: "fg_secondary"
    dim_foreground: "fg_primary"
    title_bold: true
  tab_bar:
    background: "bg_secondary"
    active_fg: "bg_primary"
    active_bg: "accent"
    inactive_fg: "fg_primary"
    inactive_bg: "bg_secondary"
  content:
    foreground: "fg_primary"
    background: "bg_primary"
  status_bar:
    foreground: "fg_dim"
    background: "bg_secondary"
    error_fg: "error"
    connected_fg: "success"
  table:
    header_fg: "fg_secondary"
    header_bg: "bg_secondary"
    header_bold: true
    row_fg: "fg_primary"
    row_alt_bg: "bg_secondary"
    selected_fg: "bg_primary"
    selected_bg: "accent"
  gauge:
    empty_fg: "fg_dim"
    label_fg: "fg_primary"
    thresholds:
      - { percent: 0,  color: "success" }
      - { percent: 70, color: "warning" }
      - { percent: 90, color: "error" }
  checklist:
    done_fg: "success"
    active_fg: "accent"
    pending_fg: "fg_dim"
  section_title:
    foreground: "accent"
    bold: true
  colors:
    green: "success"
    yellow: "warning"
    red: "error"
    cyan: "info"
    blue: "accent"
    magenta: "magenta"
    dim: "fg_dim"
    bright: "fg_secondary"
